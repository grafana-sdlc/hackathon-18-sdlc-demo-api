name: Build and publish API
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        id: sdlc_image_build_2
      - name: Send image provenance to Grafana
        uses: grafana/hackathon-18-sdlc-github-action@9208e7efd567bc32094d964513e4a0d2298a3214
        if: ${{ success() && steps.sdlc_image_build_2.outputs.digest != '' }}
        with:
          image: ghcr.io/grafana-sdlc/sdlc-demo-api
          digest: ${{ steps.sdlc_image_build_2.outputs.digest }}
          gateway-url: https://sdlc-github.grafana-dev.net
      - name: Test, build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/grafana-sdlc/sdlc-demo-api:sha-${{ github.sha }}
          build-args: REVISION=${{ github.sha }}
          # The SDLC App's suggested PR adds provenance reporting for the demo.
          provenance: false
          sbom: false
      - name: Send image provenance to Grafana
        uses: grafana/hackathon-18-sdlc-github-action@9208e7efd567bc32094d964513e4a0d2298a3214
        if: ${{ success() && steps.build.outputs.digest != '' }}
        with:
          image: ghcr.io/grafana-sdlc/sdlc-demo-api
          digest: ${{ steps.build.outputs.digest }}
          gateway-url: https://sdlc-github.grafana-dev.net
      - name: Save immutable deployment reference
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          jq -n --arg image 'ghcr.io/grafana-sdlc/sdlc-demo-api' \
            --arg digest "$IMAGE_DIGEST" --arg sha "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            '{image: $image, digest: $digest, sha: $sha, run: $run}' > image.json
          echo "Image: ghcr.io/grafana-sdlc/sdlc-demo-api@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload deployment reference
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-image
          path: image.json
          retention-days: 90
          if-no-files-found: error
